name: Build moOde Packages for Debian Trixie (x86_64)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: '要编译的组件名称'
        required: true
        default: 'peppy-alsa'

jobs:
  build-trixie:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: debian:trixie-slim
      options: --user root

    steps:
    - name: Prepare Environment
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git build-essential devscripts debhelper dh-autoreconf fakeroot equivs sed ca-certificates curl wget pkg-config jq dpkg-dev meson python3-dev libtool-bin swig ruby ruby-dev dh-make libasound2-dev libfftw3-dev python3-setuptools nodejs npm zip unzip libcurl4-gnutls-dev libmicrohttpd-dev libmpdclient-dev
        npm install -g gulp-cli
        gem install --no-document fpm

    - name: Clone Source Code
      run: git clone --depth 1 --branch main https://github.com/mslovecc/pkgbuild.git .

    - name: Restore Core Build Features
      run: |
        TARGET_PKG="${{ github.event.inputs.package_name }}"
        
        # 1. 恢复 libupnpp-bindings 的特殊构建逻辑
        if [ "$TARGET_PKG" = "libupnpp-bindings" ]; then
          mkdir -p packages/libupnpp-bindings
          git clone --depth 1 https://framagit.org/medoc92/libupnpp-bindings.git /tmp/bindings_new
          cp -r /tmp/bindings_new/* packages/libupnpp-bindings/
        fi

        # 2. 恢复 ARM 指令清洗逻辑（防止在 x86 上报错）
        find . -type f \( -name "*.sh" -o -name "rules" \) | while read -r file; do
          sed -i 's/-march=armv8-a//g; s/-mfpu=neon//g; s/-mfloat-abi=hard//g; s/ARCH=arm64/ARCH=amd64/g' "$file"
        done

    - name: Hot-Patch Target Build Scripts
      run: |
        TARGET_PKG="${{ github.event.inputs.package_name }}"
        
        # 3. 恢复 peppy-alsa 钩子
        if [ "$TARGET_PKG" = "peppy-alsa" ]; then
          echo -e "#!/usr/bin/make -f\n%:\n\tdh \$@\n\noverride_dh_auto_build:\n\tgcc -shared -fPIC -O2 src/peppyalsa.c src/meter.c src/spectrum.c -o libasound_module_pcm_peppyalsa.so -lasound -lfftw3" > /tmp/peppy_rules
          
          cat << 'EOF' > /tmp/peppy_fix.sh
          #!/bin/bash
          sed -i "s/peppy-alsaBROKEN/peppy-alsa/g" debian/control
          sed -i "s/Architecture: arm./Architecture: amd64/g" debian/control
          echo "libasound_module_pcm_peppyalsa.so usr/lib/x86_64-linux-gnu/alsa-lib" > debian/peppy-alsa.install
          cp /tmp/peppy_rules debian/rules
          chmod +x debian/rules
          EOF
          chmod +x /tmp/peppy_fix.sh
          sed -i 's/dpkg-buildpackage/\/tmp\/peppy_fix.sh \&\& dpkg-buildpackage/g' packages/peppy-alsa/build.sh
        fi

        # 4. 恢复 moode-player 环境欺骗
        if [ "$TARGET_PKG" = "moode-player" ]; then
          git clone --depth 1 https://github.com/moode-player/moode.git /tmp/moode-web-source
          echo "MOODE_DIR=/tmp/moode-web-source" >> $GITHUB_ENV
          sed -i 's/BUILD_APP=1/BUILD_APP=0/g; s/--depends php8.4-gd/--depends php-gd/g; s/exit 1/echo "Safe"/g' packages/moode-player/build.sh
        fi

    - name: Execute Build
      run: |
        export DEBFULLNAME="moOde Port"
        export DEBEMAIL="trixie@x86.local"
        export MOODE_DIR=${MOODE_DIR:-/tmp/null}
        
        PKG_DIR="packages/${{ github.event.inputs.package_name }}"
        cd "$PKG_DIR"
        
        # 5. 恢复依赖自动安装逻辑
        if [ -f "debian/control" ]; then
          apt-get install -y -f --no-install-recommends
          mk-build-deps -i -r -t "apt-get -y --no-install-recommends" || true
        fi
        
        if [ -f "./build.sh" ]; then
          chmod +x ./build.sh && ./build.sh
        else
          dpkg-buildpackage -us -uc -b
        fi

    - name: Publish
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: "debian-trixie-x86_64"
        files: packages/**/*.deb
