name: Build moOde Packages for Debian Trixie (x86_64)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: '要编译的组件名称 (例如: upmpdcli, pycamilladsp, shairport-sync-metadata-reader, peppy-alsa)'
        required: true
        default: 'peppy-alsa'

jobs:
  build-trixie:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: debian:trixie-slim
      options: --user root

    steps:
    - name: Prepare Container Environment
      run: |
        if [ -f /etc/apt/sources.list.d/debian.sources ]; then sed -i 's/Components: main/Components: main contrib non-free non-free-firmware/g' /etc/apt/sources.list.d/debian.sources; fi
        if [ -f /etc/apt/sources.list ]; then sed -i 's/trixie main/trixie main contrib non-free non-free-firmware/g' /etc/apt/sources.list; fi
        apt-get update
        apt-get install -y --no-install-recommends git build-essential devscripts debhelper dh-autoreconf fakeroot equivs sed ca-certificates curl wget ncurses-base pkg-config jq debian-keyring dpkg-dev meson python3-dev libtool-bin apt-transport-https swig ruby ruby-dev rpm dh-make libasound2-dev libfftw3-dev python3-yaml dh-python python3-setuptools python3-build python3-installer
        gem install --no-document fpm
        printf '#!/bin/sh\nwhile [ $# -gt 0 ]; do case "$1" in -E) shift ;; *=*) export "$1"; shift ;; *) break ;; esac; done\nexec "$@"\n' > /usr/local/bin/sudo
        chmod +x /usr/local/bin/sudo

    - name: Clone Source Code (Debian Native)
      run: |
        git clone --depth 1 --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git .

    - name: Align Upstream Library Versions
      run: |
        TARGET_PKG="${{ github.event.inputs.package_name }}"
        if [ "$TARGET_PKG" = "libupnpp-bindings" ]; then
          rm -rf packages/libupnpp-bindings && mkdir -p packages/libupnpp-bindings
          git clone --depth 1 https://framagit.org/medoc92/libupnpp-bindings.git /tmp/bindings_new
          cp -r /tmp/bindings_new/* packages/libupnpp-bindings/
          if [ ! -d "packages/libupnpp-bindings/debian" ]; then
             mkdir -p packages/libupnpp-bindings/debian
             echo "Source: libupnpp-bindings" > packages/libupnpp-bindings/debian/control
             echo "Section: python" >> packages/libupnpp-bindings/debian/control
             echo "Priority: optional" >> packages/libupnpp-bindings/debian/control
             echo "Maintainer: moOde Debian Trixie Porting <trixie-x86@moode-player.org>" >> packages/libupnpp-bindings/debian/control
             echo "Build-Depends: debhelper-compat (= 13), meson, python3-dev, swig, libupnpp-dev" >> packages/libupnpp-bindings/debian/control
             echo "Standards-Version: 4.6.2" >> packages/libupnpp-bindings/debian/control
             echo "" >> packages/libupnpp-bindings/debian/control
             echo "Package: python3-upnpp" >> packages/libupnpp-bindings/debian/control
             echo "Architecture: any" >> packages/libupnpp-bindings/debian/control
             echo "Depends: \${shlibs:Depends}, \${misc:Depends}, \${python3:Depends}" >> packages/libupnpp-bindings/debian/control
             echo "Description: Python3 bindings for libupnpp" >> packages/libupnpp-bindings/debian/control
             echo '#!/usr/bin/make -f' > packages/libupnpp-bindings/debian/rules
             echo '%:' >> packages/libupnpp-bindings/debian/rules
             echo '	dh $@ --buildsystem=meson' >> packages/libupnpp-bindings/debian/rules
             chmod +x packages/libupnpp-bindings/debian/rules
             echo "13" > packages/libupnpp-bindings/debian/compat
          fi
        fi

    - name: Stage and Fully Configure Developer Packages
      run: |
        TARGET_PKG="${{ github.event.inputs.package_name }}"
        if echo "$TARGET_PKG" | grep -E -q "(upmpdcli|libupnpp)"; then
          apt-get install -y --no-install-recommends libcurl4-gnutls-dev libmicrohttpd-dev libmpdclient-dev
          mkdir -p /tmp/existing_deps /tmp/dev_packages
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/debian-trixie-x86_64"
          curl -sL "$API_URL" | jq -r '.assets[] | select(.name | endswith(".deb")) | .browser_download_url' > /tmp/deb_urls.txt
          if [ -s /tmp/deb_urls.txt ]; then
            while read -r url; do wget -q -P /tmp/existing_deps/ "$url"; done < /tmp/deb_urls.txt
            cd /tmp/existing_deps/
            for deb in *.deb; do
              if echo "$deb" | grep -E -q "(ld-|-dev_|libnpupnp|libupnpp1)"; then cp "$deb" /tmp/dev_packages/; fi
            done
            if [ "$(ls -A /tmp/dev_packages 2>/dev/null)" ]; then
              dpkg -i /tmp/dev_packages/*.deb 2>/dev/null || true
              apt-get install -y -f --no-install-recommends
              dpkg -i /tmp/dev_packages/*.deb
            fi
          fi
        fi

    - name: Patch and Fix ARM Hardcoding
      run: |
        PKG_DIR="packages/${{ github.event.inputs.package_name }}"
        if [ ! -d "$PKG_DIR" ]; then exit 1; fi
        if [ -f "$PKG_DIR/debian/control" ]; then
          sed -i 's/Architecture: arm64/Architecture: amd64/g' "$PKG_DIR/debian/control"
          sed -i 's/Architecture: armhf/Architecture: amd64/g' "$PKG_DIR/debian/control"
        fi
        find . -type f \( -name "*.sh" -o -name "rules" \) | while read -r file; do
          sed -i 's/-march=armv8-a+crt//g' "$file"
          sed -i 's/-march=armv8-a//g' "$file"
          sed -i 's/-mfpu=neon//g' "$file"
          sed -i 's/-mfloat-abi=hard//g' "$file"
          sed -i 's/-mcpu=cortex-a72//g' "$file"
          sed -i 's/-mcpu=cortex-a53//g' "$file"
          sed -i 's/ARCH=arm64/ARCH=amd64/g' "$file"
          sed -i 's/ARCH=armhf/ARCH=amd64/g' "$file"
        done

    - name: Fix mpd2cdspvolume Internal Script Paths
      run: |
        BUILD_SCRIPT="packages/mpd2cdspvolume/build.sh"
        if [ -f "$BUILD_SCRIPT" ]; then
          sed -i 's/git checkout bb5e81bb3f561dac6950a6d816a132fd5873e3e9/git checkout bb5e81bb3f561dac6950a6d816a132fd5873e3e9 \&\& cd mpd2cdspvolume-*/g' "$BUILD_SCRIPT"
          sed -i 's/cp \*\.deb \.\./cp \*\.deb \.\.\/\.\./g' "$BUILD_SCRIPT"
        fi

    # 精准热拦截：为 debhelper 提供明确的安装映射文件 (.install) 指引文件流向
    - name: Intercept and Hot-Patch peppy-alsa Packaging
      run: |
        TARGET_PKG="${{ github.event.inputs.package_name }}"
        if [ "$TARGET_PKG" = "peppy-alsa" ]; then
          echo "🔧 发现目标组件 peppy-alsa，正在注入标准交付规则..."
          BUILD_SCRIPT="packages/peppy-alsa/build.sh"
          if [ -f "$BUILD_SCRIPT" ]; then
            # 1. 修复原厂脚本中错误的强行删除，改为带 -f 的静音删除
            sed -i 's/rm debian\/pep/rm -f debian\/pep/g' "$BUILD_SCRIPT"
            
            # 2. 精准前置注入控制逻辑：修改架构、注入原生 rules 编译规则，并显式生成 .install 指引文件
            sed -i '/dpkg-buildpackage/i \
        echo "================================================="\n\
        echo "💥 正在强制修正当前目录下的 Debian 元数据结构..."\n\
        sed -i "s/Architecture: arm64/Architecture: amd64/g" debian/control\n\
        echo "libasound_module_pcm_peppyalsa.so usr/lib/x86_64-linux-gnu/alsa-lib" > debian/peppy-alsa.install\n\
        printf "#%s\\n%%:\\n\\tdh \\\\\$@\\n\\noverride_dh_auto_build:\\n\\tgcc -shared -fPIC -O2 src/peppyalsa.c src/meter.c src/spectrum.c -o libasound_module_pcm_peppyalsa.so -lasound -lfftw3\\n" "!/usr/bin/make -f" > debian/rules\n\
        chmod +x debian/rules\n\
        echo "================================================="' "$BUILD_SCRIPT"
          fi
        fi

    # 核心拦截修正：针对 shairport-sync-metadata-reader 的 build.sh 注入模板覆盖逻辑，避开 patch 冲突
    - name: Intercept and Fix shairport-sync-metadata-reader Patch Conflict
      run: |
        TARGET_PKG="${{ github.event.inputs.package_name }}"
        if [ "$TARGET_PKG" = "shairport-sync-metadata-reader" ]; then
          echo "🔧 侦测到目标组件，正在改写 build.sh 以绕过新版 dh_make 的 copyright 冲突..."
          BUILD_SCRIPT="packages/shairport-sync-metadata-reader/build.sh"
          if [ -f "$BUILD_SCRIPT" ]; then
            sed -i '/rm ..\/${PKGNAME}_\${PKGVERSION}.tar.gz/a \
        printf "Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/\\nSource: https://github.com/mikebrady/shairport-sync-metadata-reader\\nUpstream-Name: shairport-sync-metadata-reader\\n\\nFiles: *\\nCopyright: 2015 Mike Brady <mikebrady@eircom.net>\\nLicense: MIT\\n\\nFiles: debian/*\\nCopyright: 2025 Bitkeeper <bitkeeper@users.noreply.github.com>\\nLicense: MIT\\n" > debian/copyright' "$BUILD_SCRIPT"
            
            PATCH_FILE="packages/shairport-sync-metadata-reader/debian-copyright.patch"
            if [ -f "$PATCH_FILE" ]; then
              sed -i '/--- shairport-sync-metadata-reader-1.0.2.*/,$d' "$PATCH_FILE"
            fi
          fi
        fi

    - name: Resolve Precise Dependencies for Target
      run: |
        PKG_DIR="packages/${{ github.event.inputs.package_name }}"
        cd "$PKG_DIR"
        if [ -f "debian/control" ]; then
          apt-get install -y -f --no-install-recommends || true
          mk-build-deps -i -r -t "apt-get -y -o Debug::pkgProblemResolver=yes --no-install-recommends" || apt-get install -y -f --no-install-recommends
        fi

    - name: Execute Build Script
      run: |
        mkdir -p scripts
        cp scripts/setenv.sh.example scripts/setenv.sh 2>/dev/null || true
        export DEBFULLNAME="moOde Debian Trixie Porting"
        export DEBEMAIL="trixie-x86@moode-player.org"
        export TERM=xterm
        PKG_DIR="packages/${{ github.event.inputs.package_name }}"
        cd "$PKG_DIR"
        if [ -f "./build.sh" ]; then
          chmod +x ./build.sh
          ./build.sh
        elif [ -f "./compile.sh" ]; then
          chmod +x ./compile.sh
          ./compile.sh
        elif [ -f "debian/rules" ]; then
          dpkg-buildpackage -us -uc -b
        else
          exit 1
        fi

    - name: Automatically Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "debian-trixie-x86_64"
        name: "moOde Packages for Debian Trixie (x86_64)"
        body: "这里统一存放移植到 x86_64 平台 (Debian Trixie) 的 moOde 核心组件服务。由 GitHub Actions 自动化编译生成。"
        draft: false
        prerelease: false
        files: |
          ${{ github.workspace }}/packages/**/*.deb
          ${{ github.workspace }}/*.deb
