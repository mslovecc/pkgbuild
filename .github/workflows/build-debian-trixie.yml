name: Build moOde Packages for Debian Trixie (x86_64)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: '要编译的组件名称 (例如: upmpdcli, bluez-alsa, chromium, libupnpp-bindings)'
        required: true
        default: 'upmpdcli'

jobs:
  build-trixie:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: debian:trixie-slim
      options: --user root

    steps:
    - name: Prepare Container Environment
      run: |
        # 1. 解锁 Debian Trixie 的 contrib、non-free 和 non-free-firmware 软件源
        if [ -f /etc/apt/sources.list.d/debian.sources ]; then
          sed -i 's/Components: main/Components: main contrib non-free non-free-firmware/g' /etc/apt/sources.list.d/debian.sources
        fi
        if [ -f /etc/apt/sources.list ]; then
          sed -i 's/trixie main/trixie main contrib non-free non-free-firmware/g' /etc/apt/sources.list
        fi

        apt-get update
        # 2. 补齐基础网络和核心编译工具链
        apt-get install -y --no-install-recommends \
          git build-essential devscripts debhelper dh-autoreconf fakeroot equivs sed ca-certificates \
          curl wget ncurses-base pkg-config jq debian-keyring dpkg-dev meson python3-dev
          
        # 3. 兼容带环境变量包装调用的伪 sudo 脚本
        cat << 'EOF' > /usr/local/bin/sudo
        #!/bin/sh
        while [ $# -gt 0 ]; do
            case "$1" in
                -E)
                    shift
                    ;;
                *=*)
                    export "$1"
                    shift
                    ;;
                *)
                    break
                    ;;
            esac
        done
        exec "$@"
        EOF
        chmod +x /usr/local/bin/sudo

    - name: Clone Source Code (Debian Native)
      run: |
        git clone --depth 1 --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git .

    # 核心控制：仅在编译 upmpdcli 或 libupnpp 相关链条时，才去释放本地历史底包
    - name: Stage Previously Compiled Developer Packages
      run: |
        TARGET_PKG="${{ github.event.inputs.package_name }}"
        
        if echo "$TARGET_PKG" | grep -E -q "(upmpdcli|libupnpp)"; then
          echo "🎯 检测到目标组件为 $TARGET_PKG，正在从 GitHub Release 下载历史 x86_64 关键开发底包..."
          mkdir -p /tmp/existing_deps
          mkdir -p /tmp/dev_packages
          
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/debian-trixie-x86_64"
          curl -sL "$API_URL" | jq -r '.assets[] | select(.name | endswith(".deb")) | .browser_download_url' > /tmp/deb_urls.txt
          
          if [ -s /tmp/deb_urls.txt ]; then
            while read -r url; do
              wget -q -P /tmp/existing_deps/ "$url"
            done < /tmp/deb_urls.txt
            
            echo "=== 筛选出真正的核心基础库及 -dev 关键包进行释放 ==="
            cd /tmp/existing_deps/
            for deb in *.deb; do
              # 只有基础核心库和开发头文件包才允许进入环境，杜绝应用插件包污染环境
              if echo "$deb" | grep -E -q "(ld-|-dev_|libnpupnp|libupnpp1)"; then
                echo "📦 允许释放核心底包: $deb"
                cp "$deb" /tmp/dev_packages/
              fi
            done
            
            if [ "$(ls -A /tmp/dev_packages 2>/dev/null)" ]; then
              dpkg -i /tmp/dev_packages/*.deb 2>/dev/null || true
            fi
          fi
        else
          echo "ℹ️ 当前目标组件为 $TARGET_PKG，属于独立构建，跳过本地历史依赖包装配。"
        fi

    - name: Patch and Fix ARM Hardcoding
      run: |
        PKG_DIR="packages/${{ github.event.inputs.package_name }}"
        
        if [ ! -d "$PKG_DIR" ]; then
          echo "❌ 错误: 在 packages/ 目录下找不到组件 '${{ github.event.inputs.package_name }}'"
          exit 1
        fi

        if [ -f "$PKG_DIR/debian/control" ]; then
          sed -i 's/Architecture: arm64/Architecture: amd64/g' "$PKG_DIR/debian/control"
          sed -i 's/Architecture: armhf/Architecture: amd64/g' "$PKG_DIR/debian/control"
        fi

        find . -type f \( -name "*.sh" -o -name "rules" \) | while read -r file; do
          sed -i 's/-march=armv8-a+crt//g' "$file"
          sed -i 's/-march=armv8-a//g' "$file"
          sed -i 's/-mfpu=neon//g' "$file"
          sed -i 's/-mfloat-abi=hard//g' "$file"
          sed -i 's/-mcpu=cortex-a72//g' "$file"
          sed -i 's/-mcpu=cortex-a53//g' "$file"
          sed -i 's/ARCH=arm64/ARCH=amd64/g' "$file"
          sed -i 's/ARCH=armhf/ARCH=amd64/g' "$file"
        done

    # 精准控制：利用 mk-build-deps 为当前包安装官方系统依赖，完成闭环
    - name: Resolve Precise Dependencies for Target
      run: |
        PKG_DIR="packages/${{ github.event.inputs.package_name }}"
        cd "$PKG_DIR"
        
        if [ -f "debian/control" ]; then
          echo "🧹 预先清理修复 APT 状态..."
          apt-get install -y -f --no-install-recommends || true
          
          echo "🎯 正在通过 mk-build-deps 建立目标组件编译环境（顺藤摸瓜补齐官方开发依赖）..."
          # 如果预装的核心底包缺少关联的系统开发包（如 libcurl-dev 等），由下方的 -f 机制强制拉取完成闭环
          mk-build-deps -i -r -t "apt-get -y -o Debug::pkgProblemResolver=yes --no-install-recommends" || {
            echo "⚠️ mk-build-deps 触发联动修复，正在执行系统级强制补齐..."
            apt-get install -y -f --no-install-recommends
          }
          
          # 官方系统底层开发依赖补齐后，重新强刷一下本地底包，确保它们在编译开始前处于就绪状态
          if [ -d "/tmp/dev_packages" ] && [ "$(ls -A /tmp/dev_packages 2>/dev/null)" ]; then
            dpkg -i /tmp/dev_packages/*.deb || apt-get install -y -f --no-install-recommends
          fi
        fi

    - name: Execute Build Script
      run: |
        mkdir -p scripts
        cp scripts/setenv.sh.example scripts/setenv.sh 2>/dev/null || true
        
        export DEBFULLNAME="moOde Debian Trixie Porting"
        export DEBEMAIL="trixie-x86@moode-player.org"
        export TERM=xterm
        
        PKG_DIR="packages/${{ github.event.inputs.package_name }}"
        cd "$PKG_DIR"
        
        if [ -f "./build.sh" ]; then
          chmod +x ./build.sh
          ./build.sh
        elif [ -f "./compile.sh" ]; then
          chmod +x ./compile.sh
          ./compile.sh
        elif [ -f "debian/rules" ]; then
          dpkg-buildpackage -us -uc -b
        else
          echo "❌ 错误: 未找到可执行的编译脚本" && exit 1
        fi

    - name: Automatically Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "debian-trixie-x86_64"
        name: "moOde Packages for Debian Trixie (x86_64)"
        body: "这里统一存放移植到 x86_64 平台 (Debian Trixie) 的 moOde 核心组件服务。由 GitHub Actions 自动化编译生成。"
        draft: false
        prerelease: false
        files: |
          ${{ github.workspace }}/packages/**/*.deb
          ${{ github.workspace }}/*.deb
